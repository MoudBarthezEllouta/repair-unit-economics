[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "repair-unit-economics"
version = "0.1.0"
description = "Synthetic operations analytics portfolio by Moud Barthez Ellouta"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
diagnostic_routing = ["sql/*.sql"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
